<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/fgo_diamond.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FGOdle — A daily Fate/Grand Order Wordle. Guess the mystery servant using class, rarity, attribute, gender, alignment, and trait clues!" />
    <meta name="theme-color" content="#131318" />
    <title>FGOdle — Fate/Grand Order Wordle</title>
    <!-- Anti-FOUC: apply saved theme before Vue renders -->
    <script>
      (function() {
        var t = localStorage.getItem('fgo-wordle-theme');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
